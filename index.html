<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma collection de films</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      background: #1b1b1b;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      color: #aaa;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .panel {
      background: #1b1b1b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      font-size: 15px;
    }

    input,
    select {
      background: #252525;
      color: white;
    }

    button {
      background: #e50914;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #b80710;
    }

    .secondary {
      background: #333;
    }

    .secondary:hover {
      background: #444;
    }

    .danger {
      background: #7d0000;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .actions button {
      width: auto;
    }

    .search {
      margin-bottom: 15px;
    }

    .status {
      margin-top: 10px;
      color: #aaa;
      min-height: 20px;
    }

    .films {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .film {
      background: #1b1b1b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #292929;
    }

    .film-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      background: #292929;
      display: block;
    }

    .no-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #292929;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      text-align: center;
      padding: 20px;
    }

    .film-info {
      padding: 14px;
    }

    .film-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .film-details {
      color: #aaa;
      font-size: 13px;
      line-height: 1.6;
    }

    .film-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .film-actions button {
      padding: 8px;
      font-size: 13px;
    }

    .count {
      color: #aaa;
      margin-bottom: 15px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 25px;
      }

      .container {
        padding: 12px;
      }

      .films {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .film-title {
        font-size: 15px;
      }

      .film-info {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎬 Ma collection de films</h1>
  <p>Ma collection personnelle</p>
</header>

<div class="container">

  <div class="panel">

    <h2>➕ Ajouter un film</h2>

    <div class="form-grid">

      <input
        type="text"
        id="title"
        placeholder="Titre du film *"
      >

      <input
        type="number"
        id="year"
        placeholder="Année"
      >

      <input
        type="text"
        id="director"
        placeholder="Réalisateur"
      >

      <input
        type="text"
        id="genre"
        placeholder="Genre"
      >

      <select id="format">
        <option value="">Format</option>
        <option value="DVD">DVD</option>
        <option value="Blu-ray">Blu-ray</option>
        <option value="4K UHD">4K UHD</option>
        <option value="VHS">VHS</option>
        <option value="Autre">Autre</option>
      </select>

      <select id="vf">
        <option value="">Version française ?</option>
        <option value="Oui">Oui</option>
        <option value="Non">Non</option>
        <option value="Inconnu">Inconnu</option>
      </select>

      <input
        type="url"
        id="cover"
        placeholder="URL de la jaquette"
      >

    </div>

    <div class="actions">
      <button onclick="addFilm()">Ajouter le film</button>
      <button class="secondary" onclick="clearForm()">Effacer</button>
    </div>

    <div id="status" class="status"></div>

  </div>


  <div class="panel">

    <h2>🔎 Rechercher dans ma collection</h2>

    <input
      class="search"
      type="text"
      id="search"
      placeholder="Rechercher un titre, réalisateur, genre..."
      oninput="displayFilms()"
    >

    <div class="form-grid">

      <select id="filterFormat" onchange="displayFilms()">
        <option value="">Tous les formats</option>
        <option value="DVD">DVD</option>
        <option value="Blu-ray">Blu-ray</option>
        <option value="4K UHD">4K UHD</option>
        <option value="VHS">VHS</option>
        <option value="Autre">Autre</option>
      </select>

      <select id="filterVF" onchange="displayFilms()">
        <option value="">VF : tous</option>
        <option value="Oui">VF : Oui</option>
        <option value="Non">VF : Non</option>
        <option value="Inconnu">VF : Inconnu</option>
      </select>

    </div>

  </div>


  <div class="panel">

    <h2>💾 Sauvegarde</h2>

    <p>
      Les films sont enregistrés dans Supabase et restent donc accessibles
      depuis tes différents appareils.
    </p>

    <div class="actions">
      <button class="secondary" onclick="exportFilms()">
        Exporter ma collection
      </button>

      <button class="secondary" onclick="document.getElementById('importFile').click()">
        Importer une collection
      </button>

      <input
        type="file"
        id="importFile"
        accept=".json"
        class="hidden"
        onchange="importFilms(event)"
      >
    </div>

  </div>


  <div class="panel">

    <h2>🎞️ Mes films</h2>

    <div id="count" class="count">
      Chargement...
    </div>

    <div id="films" class="films"></div>

  </div>

</div>


<script>

  /* ============================================================
     CONFIGURATION SUPABASE
     ============================================================ */

  const SUPABASE_URL = "https://nhiektoatqmwjtcbvvsi.supabase.co";

  /*
    IMPORTANT :
    Remplace UNIQUEMENT le texte ci-dessous par ta clé
    Publishable créée dans Supabase.
  */

  const SUPABASE_KEY = "sb_publishable_sAX3n8pDc5P8sUxIsrjF3g_SRxCx6Hb";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let films = [];


  /* ============================================================
     CHARGEMENT
     ============================================================ */

  async function loadFilms() {

    setStatus("Chargement de la collection...");

    const { data, error } = await supabaseClient
      .from("Films")
      .select("*")
      .order("title", { ascending: true });

    if (error) {

      console.error(error);

      setStatus(
        "❌ Erreur de chargement : " + error.message
      );

      return;
    }

    films = data || [];

    displayFilms();

    setStatus(
      films.length +
      " film" +
      (films.length > 1 ? "s" : "") +
      " chargé" +
      (films.length > 1 ? "s" : "") +
      "."
    );
  }


  /* ============================================================
     AFFICHAGE
     ============================================================ */

  function displayFilms() {

    const container =
      document.getElementById("films");

    const search =
      document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const filterFormat =
      document.getElementById("filterFormat").value;

    const filterVF =
      document.getElementById("filterVF").value;


    const filtered =
      films.filter(film => {

        const text = (
          (film.title || "") +
          " " +
          (film.director || "") +
          " " +
          (film.genre || "") +
          " " +
          (film.year || "")
        ).toLowerCase();

        if (
          search &&
          !text.includes(search)
        ) {
          return false;
        }

        if (
          filterFormat &&
          film.format !== filterFormat
        ) {
          return false;
        }

        if (
          filterVF &&
          film.vf !== filterVF
        ) {
          return false;
        }

        return true;
      });


    document.getElementById("count").textContent =
      filtered.length +
      " film" +
      (filtered.length > 1 ? "s" : "") +
      " affiché" +
      (filtered.length > 1 ? "s" : "") +
      " / " +
      films.length +
      " au total";


    container.innerHTML = "";


    if (filtered.length === 0) {

      container.innerHTML =
        "<p style='color:#888;'>Aucun film trouvé.</p>";

      return;
    }


    filtered.forEach(film => {

      const card =
        document.createElement("div");

      card.className = "film";


      let coverHTML = "";

      if (film.cover) {

        coverHTML =
          `<img
            class="film-cover"
            src="${escapeAttribute(film.cover)}"
            alt="Jaquette de ${escapeHTML(film.title || "")}"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          >
          <div class="no-cover" style="display:none;">
            Pas de jaquette
          </div>`;

      } else {

        coverHTML =
          `<div class="no-cover">
            Pas de jaquette
          </div>`;
      }


      card.innerHTML = `

        ${coverHTML}

        <div class="film-info">

          <div class="film-title">
            ${escapeHTML(film.title || "Sans titre")}
          </div>

          <div class="film-details">

            ${
              film.year
                ? "📅 " + escapeHTML(String(film.year)) + "<br>"
                : ""
            }

            ${
              film.director
                ? "🎬 " + escapeHTML(film.director) + "<br>"
                : ""
            }

            ${
              film.genre
                ? "🎭 " + escapeHTML(film.genre) + "<br>"
                : ""
            }

            ${
              film.format
                ? "💿 " + escapeHTML(film.format) + "<br>"
                : ""
            }

            ${
              film.vf
                ? "🇫🇷 VF : " + escapeHTML(film.vf)
                : ""
            }

          </div>

          <div class="film-actions">

            <button
              class="danger"
              onclick="deleteFilm(${film.id})"
            >
              Supprimer
            </button>

          </div>

        </div>
      `;


      container.appendChild(card);

    });

  }


  /* ============================================================
     AJOUT
     ============================================================ */

  async function addFilm() {

    const title =
      document.getElementById("title").value.trim();

    if (!title) {

      setStatus(
        "⚠️ Le titre du film est obligatoire."
      );

      return;
    }


    const yearValue =
      document.getElementById("year").value;


    const film = {

      title: title,

      year:
        yearValue
          ? parseInt(yearValue)
          : null,

      director:
        document.getElementById("director")
          .value
          .trim() || null,

      genre:
        document.getElementById("genre")
          .value
          .trim() || null,

      format:
        document.getElementById("format")
          .value || null,

      vf:
        document.getElementById("vf")
          .value || null,

      cover:
        document.getElementById("cover")
          .value
          .trim() || null

    };


    setStatus("Ajout du film...");


    const { data, error } =
      await supabaseClient
        .from("Films")
        .insert([film])
        .select();


    if (error) {

      console.error(error);

      setStatus(
        "❌ Impossible d'ajouter le film : " +
        error.message
      );

      return;
    }


    if (data && data.length) {

      films.push(data[0]);

    }


    clearForm();

    displayFilms();

    setStatus(
      "✅ " +
      title +
      " a été ajouté à ta collection."
    );

  }


  /* ============================================================
     SUPPRESSION
     ============================================================ */

  async function deleteFilm(id) {

    const film =
      films.find(f => f.id === id);

    if (!film) return;


    const confirmation =
      confirm(
        'Supprimer "' +
        film.title +
        '" de ta collection ?'
      );


    if (!confirmation) return;


    setStatus("Suppression...");


    const { error } =
      await supabaseClient
        .from("Films")
        .delete()
        .eq("id", id);


    if (error) {

      console.error(error);

      setStatus(
        "❌ Erreur lors de la suppression : " +
        error.message
      );

      return;
    }


    films =
      films.filter(f => f.id !== id);


    displayFilms();

    setStatus(
      "🗑️ Film supprimé."
    );

  }


  /* ============================================================
     FORMULAIRE
     ============================================================ */

  function clearForm() {

    document.getElementById("title").value = "";
    document.getElementById("year").value = "";
    document.getElementById("director").value = "";
    document.getElementById("genre").value = "";
    document.getElementById("format").value = "";
    document.getElementById("vf").value = "";
    document.getElementById("cover").value = "";

  }


  /* ============================================================
     EXPORT
     ============================================================ */

  function exportFilms() {

    const json =
      JSON.stringify(
        films,
        null,
        2
      );


    const blob =
      new Blob(
        [json],
        {
          type: "application/json"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");


    a.href = url;

    a.download =
      "ma-collection-films.json";


    a.click();


    URL.revokeObjectURL(url);


    setStatus(
      "💾 Collection exportée."
    );

  }


  /* ============================================================
     IMPORT
     ============================================================ */

  async function importFilms(event) {

    const file =
      event.target.files[0];

    if (!file) return;


    try {

      const text =
        await file.text();

      const imported =
        JSON.parse(text);


      if (!Array.isArray(imported)) {

        throw new Error(
          "Le fichier ne contient pas une collection valide."
        );

      }


      setStatus(
        "Importation de " +
        imported.length +
        " film(s)..."
      );


      /*
        On ne réutilise pas les anciens IDs.
        Supabase les créera automatiquement.
      */

      const cleanFilms =
        imported.map(film => ({

          title: film.title || "Sans titre",

          year:
            film.year
              ? parseInt(film.year)
              : null,

          director:
            film.director || null,

          genre:
            film.genre || null,

          format:
            film.format || null,

          vf:
            film.vf || null,

          cover:
            film.cover || null

        }));


      const { error } =
        await supabaseClient
          .from("Films")
          .insert(cleanFilms);


      if (error) {

        throw error;

      }


      await loadFilms();


      setStatus(
        "✅ Collection importée avec succès."
      );

    }

    catch (error) {

      console.error(error);

      setStatus(
        "❌ Erreur d'importation : " +
        error.message
      );

    }


    event.target.value = "";

  }


  /* ============================================================
     UTILITAIRES
     ============================================================ */

  function setStatus(message) {

    document.getElementById("status")
      .textContent = message;

  }


  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return String(value)
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ============================================================
     DÉMARRAGE
     ============================================================ */

  loadFilms();

</script>

</body>
</html>
