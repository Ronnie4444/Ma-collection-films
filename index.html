<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma collection de films</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#111;
  color:#f5f5f5;
}

header{
  padding:28px 18px 18px;
  position:sticky;
  top:0;
  background:#111e;
  backdrop-filter:blur(12px);
  z-index:5;
}

h1{
  margin:0 0 6px;
  font-size:30px;
}

.sub{
  color:#aaa;
  margin-bottom:18px;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.controls input,
.controls select,
.controls button{
  border:1px solid #333;
  background:#1c1c1c;
  color:#fff;
  border-radius:10px;
  padding:11px 12px;
  font-size:14px;
}

.controls input{
  flex:1;
  min-width:180px;
}

.controls button{
  cursor:pointer;
}

.controls button:hover{
  background:#292929;
}

main{
  padding:8px 18px 40px;
}

.count{
  color:#999;
  margin:12px 0 18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:18px;
}

.card{
  background:#1a1a1a;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 16px #0005;
}

.cover{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#292929;
  display:block;
}

.info{
  padding:10px;
}

.title{
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  font-size:12px;
  color:#999;
  margin-top:5px;
  line-height:1.6;
}

.empty{
  padding:40px;
  text-align:center;
  color:#999;
  grid-column:1/-1;
}

dialog{
  border:0;
  border-radius:16px;
  background:#1b1b1b;
  color:#fff;
  width:min(430px,92vw);
  padding:0;
  box-shadow:0 20px 60px #0009;
}

dialog::backdrop{
  background:#000b;
}

.form{
  padding:20px;
}

.form h2{
  margin-top:0;
}

.form label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin:12px 0 5px;
}

.form input,
.form select{
  width:100%;
  padding:11px;
  border-radius:9px;
  border:1px solid #444;
  background:#111;
  color:#fff;
}

.actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:18px;
}

.actions button{
  padding:10px 14px;
  border:0;
  border-radius:9px;
  cursor:pointer;
}

.primary{
  background:#fff;
  color:#111;
}
</style>
</head>

<body>

<header>

<h1>🎬 Ma collection</h1>

<div class="sub">
Mon catalogue personnel de films
</div>

<div class="controls">

<input
  id="search"
  placeholder="🔎 Rechercher un film…"
>

<select id="format">
  <option value="">Tous les formats</option>
  <option>DVD</option>
  <option>Blu-ray</option>
  <option>4K UHD</option>
  <option>VHS</option>
</select>

<select id="vf">
  <option value="">VF : tous</option>
  <option value="oui">VF</option>
  <option value="non">Sans VF</option>
</select>

<button onclick="openAdd()">
  ＋ Ajouter un film
</button>

<button onclick="exportData()">
  💾 Exporter
</button>

</div>

</header>

<main>

<div class="count" id="count"></div>

<div class="grid" id="grid"></div>

</main>


<dialog id="dlg">

<form class="form" id="filmForm">

<h2>Ajouter un film</h2>

<label>Titre</label>
<input id="title" required>

<label>Année</label>
<input
  id="year"
  type="number"
  min="1888"
  max="2100"
>

<label>Réalisateur</label>
<input
  id="director"
  placeholder="Nom du réalisateur"
>

<label>Genre</label>
<input
  id="genre"
  placeholder="Horreur, fantastique..."
>

<label>Format</label>
<select id="fmt">
  <option>DVD</option>
  <option>Blu-ray</option>
  <option>4K UHD</option>
  <option>VHS</option>
</select>

<label>VF disponible ?</label>
<select id="hasvf">
  <option value="oui">Oui</option>
  <option value="non">Non</option>
</select>

<label>Image / jaquette (URL facultative)</label>
<input
  id="cover"
  placeholder="https://..."
>

<div class="actions">

<button
  type="button"
  onclick="dlg.close()"
>
  Annuler
</button>

<button
  class="primary"
  type="submit"
>
  Ajouter
</button>

</div>

</form>

</dialog>


<script>

const key = "ma_collection_films_v1";

let films = JSON.parse(
  localStorage.getItem(key) || "[]"
);


const seed = [

  {
    title:"Evil Dead",
    year:1981,
    director:"",
    genre:"",
    format:"Blu-ray",
    vf:"oui",
    cover:""
  },

  {
    title:"Hellraiser",
    year:1987,
    director:"",
    genre:"",
    format:"Blu-ray",
    vf:"oui",
    cover:""
  },

  {
    title:"Braindead",
    year:1992,
    director:"",
    genre:"",
    format:"Blu-ray",
    vf:"oui",
    cover:""
  },

  {
    title:"Creepshow",
    year:1982,
    director:"",
    genre:"",
    format:"Blu-ray",
    vf:"oui",
    cover:""
  }

];


if(!films.length){

  films = seed;

  save();

}


function save(){

  localStorage.setItem(
    key,
    JSON.stringify(films)
  );

}


function render(){

  const q =
    search.value.toLowerCase().trim();

  const f = format.value;

  const v = vf.value;


  const list = films.filter(x =>

    (!q ||
      x.title.toLowerCase().includes(q)
    )

    &&

    (!f ||
      x.format === f
    )

    &&

    (!v ||
      x.vf === v
    )

  );


  count.textContent =
    `${list.length} film${list.length>1?"s":""} affiché${list.length>1?"s":""} · ${films.length} dans la collection`;


  grid.innerHTML = list.length

    ?

    list.map(x => `

      <article class="card">

        ${
          x.cover

          ?

          `<img
            class="cover"
            src="${esc(x.cover)}"
            alt=""
          >`

          :

          `<div class="cover"></div>`
        }


        <div class="info">

          <div
            class="title"
            title="${esc(x.title)}"
          >
            ${esc(x.title)}
          </div>


          <div class="meta">

            ${x.year || "—"}
            ·
            ${x.format}
            ·
            ${x.vf==="oui" ? "🇫🇷 VF" : "VOST/VO"}

            <br>

            ${
              x.director
              ?
              `🎬 ${esc(x.director)}<br>`
              :
              ""
            }

            ${
              x.genre
              ?
              `👻 ${esc(x.genre)}`
              :
              ""
            }

          </div>

        </div>

      </article>

    `).join("")

    :

    `<div class="empty">
      Aucun film trouvé.
    </div>`;

}


function esc(s){

  return String(s ?? "")
    .replace(/[&<>"']/g, m => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[m]));

}


function openAdd(){

  filmForm.reset();

  dlg.showModal();

  title.focus();

}


filmForm.addEventListener(
  "submit",
  e => {

    e.preventDefault();


    films.push({

      title:title.value.trim(),

      year:year.value,

      director:director.value.trim(),

      genre:genre.value.trim(),

      format:fmt.value,

      vf:hasvf.value,

      cover:cover.value.trim()

    });


    save();

    dlg.close();

    render();

  }
);


[search,format,vf].forEach(
  x => x.addEventListener(
    "input",
    render
  )
);


function exportData(){

  const blob = new Blob(

    [
      JSON.stringify(
        films,
        null,
        2
      )
    ],

    {
      type:"application/json"
    }

  );


  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download =
    "ma-collection-films.json";

  a.click();

  URL.revokeObjectURL(a.href);

}


render();

</script>

</body>
</html>
