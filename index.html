<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ma collection de films</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #eee;
    }

    header {
      background: #1b1b1b;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      color: #aaa;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      background: #252525;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin: 0;
    }

    .tab.active {
      background: #e50914;
      color: white;
      border-color: #e50914;
    }

    .login-box,
    .owner-panel,
    .filters {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .login-box h2,
    .owner-panel h2 {
      margin-top: 0;
    }

    input,
    select,
    button {
      font-family: inherit;
      font-size: 15px;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      margin-top: 6px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #e50914;
      color: white;
    }

    .btn-secondary {
      background: #444;
      color: white;
    }

    .btn-edit {
      background: #2878d7;
      color: white;
    }

    .btn-delete {
      background: #9b1c1c;
      color: white;
    }

    .btn-cancel {
      background: #555;
      color: white;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .form-full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      color: #ddd;
      font-weight: bold;
    }

    .help {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
      font-weight: normal;
    }

    .cover-input {
      padding: 8px;
    }

    .owner-status {
      background: #123b1f;
      border: 1px solid #246b38;
      color: #a7e6b6;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 12px;
    }

    .collection-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0;
      gap: 10px;
      flex-wrap: wrap;
    }

    .collection-count {
      color: #bbb;
    }

    .films-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .film-card {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .film-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      background: #222;
    }

    .no-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #252525;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      text-align: center;
      padding: 20px;
    }

    .film-info {
      padding: 14px;
      flex: 1;
    }

    .film-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
      color: white;
    }

    .film-meta {
      font-size: 13px;
      color: #aaa;
      line-height: 1.6;
    }

    .film-actions {
      padding: 0 14px 14px;
      display: flex;
      gap: 8px;
    }

    .film-actions button {
      flex: 1;
      margin-top: 0;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
    }

    .message.success {
      display: block;
      background: #123b1f;
      border: 1px solid #246b38;
      color: #a7e6b6;
    }

    .message.error {
      display: block;
      background: #401515;
      border: 1px solid #762626;
      color: #ffaaaa;
    }

    .edit-title {
      color: #6faeff;
    }

    @media (max-width: 700px) {
      .form-grid,
      .filters-grid {
        grid-template-columns: 1fr;
      }

      .films-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .film-title {
        font-size: 16px;
      }

      .tabs {
        gap: 6px;
      }

      .tab {
        font-size: 14px;
        padding: 12px 6px;
      }
    }

    @media (max-width: 420px) {
      .films-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎬 Ma collection de films</h1>
  <p>Ma collection personnelle</p>
</header>

<div class="container">

  <div class="tabs">

    <button
      id="collectionTab"
      class="tab active"
      onclick="switchTab('collection')"
    >
      🎬 Ma collection
    </button>

    <button
      id="wishlistTab"
      class="tab"
      onclick="switchTab('wishlist')"
    >
      ❤️ Ma wishlist
    </button>

  </div>


  <!-- CONNEXION -->

  <div class="login-box" id="loginBox">

    <h2>🔐 Mode propriétaire</h2>

    <label>
      Adresse e-mail
      <input
        type="email"
        id="email"
        placeholder="Votre adresse e-mail"
      >
    </label>

    <label style="margin-top:12px;">
      Mot de passe
      <input
        type="password"
        id="password"
        placeholder="Votre mot de passe"
      >
    </label>

    <button
      class="btn-primary"
      onclick="login()"
    >
      Se connecter
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- MODE PROPRIETAIRE -->

  <div
    class="owner-panel hidden"
    id="ownerPanel"
  >

    <div class="owner-status">
      🔓 Mode propriétaire activé
    </div>

    <h2 id="formTitle">➕ Ajouter un film</h2>

    <div class="form-grid">

      <div class="form-full">
        <label>
          Titre *
          <input
            type="text"
            id="title"
            placeholder="Exemple : Evil Dead"
          >
        </label>
      </div>

      <div>
        <label>
          Année
          <input
            type="number"
            id="year"
            placeholder="1981"
          >
        </label>
      </div>

      <div>
        <label>
          Réalisateur
          <input
            type="text"
            id="director"
            placeholder="Sam Raimi"
          >
        </label>
      </div>

      <div>
        <label>
          Genre
          <input
            type="text"
            id="genre"
            placeholder="Horreur"
          >
        </label>
      </div>

      <div>
        <label>
          Format
          <select id="format">
            <option value="">-- Choisir --</option>
            <option value="DVD">DVD</option>
            <option value="Blu-ray">Blu-ray</option>
            <option value="4K UHD">4K UHD</option>
            <option value="VHS">VHS</option>
            <option value="Autre">Autre</option>
          </select>
        </label>
      </div>

      <div>
        <label>
          VF
          <select id="vf">
            <option value="">-- Choisir --</option>
            <option value="Oui">Oui</option>
            <option value="Non">Non</option>
            <option value="Inconnu">Inconnu</option>
          </select>
        </label>
      </div>

      <div class="form-full">
        <label>
          📷 Jaquette du film

          <input
            type="file"
            id="coverFile"
            class="cover-input"
            accept="image/*"
            capture="environment"
          >

          <div class="help">
            Tu peux prendre une photo, choisir une image dans ta galerie
            ou sélectionner un fichier.
          </div>
        </label>
      </div>

    </div>

    <button
      class="btn-primary"
      id="saveButton"
      onclick="saveFilm()"
    >
      ➕ Ajouter le film
    </button>

    <button
      class="btn-cancel hidden"
      id="cancelEditButton"
      onclick="cancelEdit()"
    >
      ✖ Annuler la modification
    </button>

    <button
      class="btn-secondary"
      onclick="logout()"
    >
      🔒 Se déconnecter
    </button>

    <div id="formMessage" class="message"></div>

  </div>


  <!-- FILTRES -->

  <div class="filters">

    <div class="filters-grid">

      <div>
        <label>
          🔎 Rechercher
          <input
            type="text"
            id="search"
            placeholder="Titre, réalisateur, genre..."
            oninput="displayFilms()"
          >
        </label>
      </div>

      <div>
        <label>
          Format
          <select
            id="formatFilter"
            onchange="displayFilms()"
          >
            <option value="">Tous</option>
            <option value="DVD">DVD</option>
            <option value="Blu-ray">Blu-ray</option>
            <option value="4K UHD">4K UHD</option>
            <option value="VHS">VHS</option>
            <option value="Autre">Autre</option>
          </select>
        </label>
      </div>

      <div>
        <label>
          VF
          <select
            id="vfFilter"
            onchange="displayFilms()"
          >
            <option value="">Tous</option>
            <option value="Oui">Oui</option>
            <option value="Non">Non</option>
            <option value="Inconnu">Inconnu</option>
          </select>
        </label>
      </div>

      <div>
        <label>
          &nbsp;
          <button
            class="btn-secondary"
            style="width:100%;"
            onclick="resetFilters()"
          >
            Réinitialiser
          </button>
        </label>
      </div>

    </div>

  </div>


  <!-- COMPTEUR -->

  <div class="collection-info">

    <div
      class="collection-count"
      id="collectionCount"
    >
      <strong id="filmCount">0</strong> film(s)
    </div>

    <div>

      <button
        class="btn-secondary"
        onclick="exportFilms()"
      >
        💾 Exporter
      </button>

      <label
        style="
          display:inline-block;
          margin-left:5px;
          font-weight:normal;
        "
      >

        <input
          type="file"
          id="importFile"
          accept=".json"
          style="display:none;"
          onchange="importFilms(event)"
        >

        <button
          class="btn-secondary"
          onclick="document.getElementById('importFile').click()"
        >
          📥 Importer
        </button>

      </label>

    </div>

  </div>


  <div
    id="filmsGrid"
    class="films-grid"
  ></div>

</div>


<script>

  /* =========================================================
     SUPABASE
     ========================================================= */

  const SUPABASE_URL =
    "https://nhiektoatqmwjtcbvvsi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_sAX3n8pDc5P8sUxIsrjF3g_SRxCx6Hb";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     VARIABLES
     ========================================================= */

  let films = [];
  let wishlist = [];
  let currentUser = null;
  let editingFilmId = null;
  let currentTab = "collection";


  /* =========================================================
     INITIALISATION
     ========================================================= */

  document.addEventListener(
    "DOMContentLoaded",
    async function() {

      const {
        data: {
          session
        }
      } = await supabaseClient.auth.getSession();

      if (session) {
        currentUser = session.user;
        showOwnerMode();
      }

      await loadAll();

    }
  );


  /* =========================================================
     CHARGEMENT
     ========================================================= */

  async function loadAll() {

    await loadFilms();
    await loadWishlist();

    displayFilms();

  }


  async function loadFilms() {

    const {
      data,
      error
    } = await supabaseClient
      .from("Films")
      .select("*");

    if (error) {

      console.error(
        "Erreur chargement Films :",
        error
      );

      films = [];

      if (currentTab === "collection") {

        const grid =
          document.getElementById("filmsGrid");

        if (grid) {
          grid.innerHTML =
            "<p>Impossible de charger les films.</p>";
        }

      }

      return;

    }

    films = data || [];

  }


  async function loadWishlist() {

    const {
      data,
      error
    } = await supabaseClient
      .from("Wishlist")
      .select("*");

    if (error) {

      console.error(
        "Erreur chargement Wishlist :",
        error
      );

      wishlist = [];

      if (currentTab === "wishlist") {

        const grid =
          document.getElementById("filmsGrid");

        if (grid) {

          grid.innerHTML =
            "<p style='color:#ffaaaa;'>Impossible de charger la wishlist.</p>";

        }

      }

      return;

    }

    wishlist = data || [];

  }


  /* =========================================================
     ONGLET
     ========================================================= */

  function switchTab(tab) {

    currentTab = tab;
    editingFilmId = null;

    clearForm();
    updateFormMode();

    const formMessage =
      document.getElementById("formMessage");

    if (formMessage) {
      formMessage.className = "message";
      formMessage.textContent = "";
    }

    const collectionTab =
      document.getElementById("collectionTab");

    const wishlistTab =
      document.getElementById("wishlistTab");

    if (collectionTab) {

      collectionTab.classList.toggle(
        "active",
        tab === "collection"
      );

    }

    if (wishlistTab) {

      wishlistTab.classList.toggle(
        "active",
        tab === "wishlist"
      );

    }

    const search =
      document.getElementById("search");

    if (search) {

      search.placeholder =
        tab === "collection"
          ? "Titre, réalisateur, genre..."
          : "Rechercher dans la wishlist...";

    }

    displayFilms();

  }


  /* =========================================================
     AUTHENTIFICATION
     ========================================================= */

  async function login() {

    const emailElement =
      document.getElementById("email");

    const passwordElement =
      document.getElementById("password");

    const message =
      document.getElementById("loginMessage");

    const email =
      emailElement
        ? emailElement.value.trim()
        : "";

    const password =
      passwordElement
        ? passwordElement.value
        : "";

    if (!email || !password) {

      showMessage(
        message,
        "Veuillez renseigner votre e-mail et votre mot de passe.",
        "error"
      );

      return;

    }

    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {

      showMessage(
        message,
        "Erreur de connexion : " + error.message,
        "error"
      );

      return;

    }

    currentUser = data.user;

    showOwnerMode();

    if (message) {
      message.className = "message";
    }

    if (emailElement) {
      emailElement.value = "";
    }

    if (passwordElement) {
      passwordElement.value = "";
    }

  }


  async function logout() {

    await supabaseClient.auth.signOut();

    currentUser = null;
    editingFilmId = null;

    cancelEdit();
    hideOwnerMode();
    displayFilms();

  }


  function showOwnerMode() {

    const loginBox =
      document.getElementById("loginBox");

    const ownerPanel =
      document.getElementById("ownerPanel");

    if (loginBox) {
      loginBox.classList.add("hidden");
    }

    if (ownerPanel) {
      ownerPanel.classList.remove("hidden");
    }

  }


  function hideOwnerMode() {

    const loginBox =
      document.getElementById("loginBox");

    const ownerPanel =
      document.getElementById("ownerPanel");

    if (loginBox) {
      loginBox.classList.remove("hidden");
    }

    if (ownerPanel) {
      ownerPanel.classList.add("hidden");
    }

  }


  /* =========================================================
     TRI ALPHABETIQUE
     ========================================================= */

  function sortFilms(items) {

    const collator =
      new Intl.Collator(
        "fr",
        {
          numeric: true,
          sensitivity: "base"
        }
      );

    return [...items].sort(
      function(a, b) {

        const titleA =
          (a.title || "").trim();

        const titleB =
          (b.title || "").trim();

        const firstA =
          titleA.charAt(0);

        const firstB =
          titleB.charAt(0);

        const isDigitA =
          /^[0-9]/.test(firstA);

        const isDigitB =
          /^[0-9]/.test(firstB);

        if (isDigitA && !isDigitB) {
          return -1;
        }

        if (!isDigitA && isDigitB) {
          return 1;
        }

        return collator.compare(
          titleA,
          titleB
        );

      }
    );

  }


  /* =========================================================
     AFFICHAGE
     ========================================================= */

  function displayFilms() {

    const searchElement =
      document.getElementById("search");

    const formatElement =
      document.getElementById("formatFilter");

    const vfElement =
      document.getElementById("vfFilter");

    const grid =
      document.getElementById("filmsGrid");

    const countElement =
      document.getElementById("filmCount");

    const countBox =
      document.getElementById("collectionCount");

    if (!grid) {
      return;
    }

    const search =
      searchElement
        ? searchElement.value.trim().toLowerCase()
        : "";

    const formatFilter =
      formatElement
        ? formatElement.value
        : "";

    const vfFilter =
      vfElement
        ? vfElement.value
        : "";

    /*
      IMPORTANT :
      La collection utilise UNIQUEMENT films.
      La wishlist utilise UNIQUEMENT wishlist.
    */

    const source =
      currentTab === "collection"
        ? films
        : wishlist;

    let filteredFilms =
      source.filter(
        function(film) {

          const searchable =
            [
              film.title,
              film.year,
              film.director,
              film.genre,
              film.format,
              film.vf
            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

          const matchesSearch =
            !search ||
            searchable.includes(search);

          const matchesFormat =
            !formatFilter ||
            film.format === formatFilter;

          const matchesVF =
            !vfFilter ||
            film.vf === vfFilter;

          return (
            matchesSearch &&
            matchesFormat &&
            matchesVF
          );

        }
      );

    filteredFilms =
      sortFilms(filteredFilms);

    /*
      Mise à jour sécurisée du compteur
    */

    if (countElement) {

      countElement.textContent =
        filteredFilms.length;

    }

    if (countBox) {

      countBox.innerHTML =
        "<strong>" +
        filteredFilms.length +
        "</strong> " +
        (
          currentTab === "collection"
            ? "film(s) dans ma collection"
            : "film(s) dans ma wishlist"
        );

    }

    if (filteredFilms.length === 0) {

      grid.innerHTML =
        currentTab === "collection"
          ? "<p style='color:#aaa;'>Aucun film trouvé.</p>"
          : "<p style='color:#aaa;'>Ta wishlist est vide.</p>";

      return;

    }

    grid.innerHTML =
      filteredFilms
        .map(
          film => createFilmCard(film)
        )
        .join("");

  }


  /* =========================================================
     CARTE
     ========================================================= */

  function createFilmCard(film) {

    let coverHTML = "";

    if (film.cover) {

      coverHTML = `
        <img
          src="${escapeHTML(film.cover)}"
          alt="Jaquette de ${escapeHTML(film.title || "")}"
          class="film-cover"
          loading="lazy"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        >

        <div
          class="no-cover"
          style="display:none;"
        >
          🖼️<br>
          Jaquette indisponible
        </div>
      `;

    }
    else {

      coverHTML = `
        <div class="no-cover">
          🖼️<br>
          Pas de jaquette
        </div>
      `;

    }

    let meta = "";

    if (film.year) {

      meta +=
        "📅 " +
        escapeHTML(String(film.year)) +
        "<br>";

    }

    if (film.director) {

      meta +=
        "🎬 " +
        escapeHTML(film.director) +
        "<br>";

    }

    if (film.genre) {

      meta +=
        "🎭 " +
        escapeHTML(film.genre) +
        "<br>";

    }

    if (film.format) {

      meta +=
        "💿 " +
        escapeHTML(film.format) +
        "<br>";

    }

    if (film.vf) {

      meta +=
        "🇫🇷 VF : " +
        escapeHTML(film.vf);

    }

    let actions = "";

    if (currentUser) {

      actions = `
        <div class="film-actions">

          <button
            class="btn-edit"
            onclick="editFilm('${escapeHTML(String(film.id))}')"
          >
            ✏️ Modifier
          </button>

          <button
            class="btn-delete"
            onclick="deleteFilm('${escapeHTML(String(film.id))}')"
          >
            🗑️ Supprimer
          </button>

        </div>
      `;

    }

    return `
      <div class="film-card">

        ${coverHTML}

        <div class="film-info">

          <div class="film-title">
            ${escapeHTML(film.title || "Sans titre")}
          </div>

          <div class="film-meta">
            ${meta}
          </div>

        </div>

        ${actions}

      </div>
    `;

  }


  /* =========================================================
     AJOUT / MODIFICATION
     ========================================================= */

  async function saveFilm() {

    if (!currentUser) {

      alert(
        "Vous devez être connecté pour modifier la collection."
      );

      return;

    }

    const titleElement =
      document.getElementById("title");

    const yearElement =
      document.getElementById("year");

    const directorElement =
      document.getElementById("director");

    const genreElement =
      document.getElementById("genre");

    const formatElement =
      document.getElementById("format");

    const vfElement =
      document.getElementById("vf");

    const coverElement =
      document.getElementById("coverFile");

    const message =
      document.getElementById("formMessage");

    const saveButton =
      document.getElementById("saveButton");

    if (!titleElement) {

      showMessage(
        message,
        "❌ Le formulaire est introuvable.",
        "error"
      );

      return;

    }

    const title =
      titleElement.value.trim();

    if (!title) {

      showMessage(
        message,
        "Le titre du film est obligatoire.",
        "error"
      );

      return;

    }

    const yearValue =
      yearElement
        ? yearElement.value.trim()
        : "";

    const filmData = {

      title: title,

      year:
        yearValue
          ? Number(yearValue)
          : null,

      director:
        directorElement
          ? directorElement.value.trim() || null
          : null,

      genre:
        genreElement
          ? genreElement.value.trim() || null
          : null,

      format:
        formatElement
          ? formatElement.value || null
          : null,

      vf:
        vfElement
          ? vfElement.value || null
          : null

    };

    const coverFile =
      coverElement &&
      coverElement.files &&
      coverElement.files.length > 0
        ? coverElement.files[0]
        : null;

    if (saveButton) {
      saveButton.disabled = true;
    }

    try {

      /*
        IMPORTANT :
        currentTab détermine directement la table.
      */

      const table =
        currentTab === "collection"
          ? "Films"
          : "Wishlist";

      /*
        MODIFICATION
      */

      if (editingFilmId) {

        if (coverFile) {

          filmData.cover =
            await uploadCover(coverFile);

        }

        const {
          error
        } = await supabaseClient
          .from(table)
          .update(filmData)
          .eq("id", editingFilmId);

        if (error) {
          throw error;
        }

        showMessage(
          message,
          "✅ Film modifié avec succès !",
          "success"
        );

      }

      /*
        AJOUT
      */

      else {

        if (coverFile) {

          filmData.cover =
            await uploadCover(coverFile);

        }
        else {

          filmData.cover = null;

        }

        const {
          error
        } = await supabaseClient
          .from(table)
          .insert([filmData]);

        if (error) {
          throw error;
        }

        showMessage(
          message,
          currentTab === "collection"
            ? "✅ Film ajouté à la collection !"
            : "❤️ Film ajouté à la wishlist !",
          "success"
        );

      }

      editingFilmId = null;

      clearForm();
      updateFormMode();

      /*
        On recharge UNIQUEMENT la bonne table.
      */

      if (currentTab === "collection") {

        await loadFilms();

      }
      else {

        await loadWishlist();

      }

      /*
        Puis on affiche le bon onglet.
      */

      displayFilms();

    }
    catch (error) {

      console.error(
        "Erreur saveFilm :",
        error
      );

      showMessage(
        message,
        "❌ Erreur : " +
        (error && error.message
          ? error.message
          : String(error)),
        "error"
      );

    }
    finally {

      if (saveButton) {
        saveButton.disabled = false;
      }

    }

  }


  /* =========================================================
     MODIFICATION
     ========================================================= */

  function editFilm(id) {

    const source =
      currentTab === "collection"
        ? films
        : wishlist;

    const film =
      source.find(
        function(item) {
          return String(item.id) === String(id);
        }
      );

    if (!film) {

      alert("Film introuvable.");

      return;

    }

    editingFilmId = id;

    document.getElementById("title").value =
      film.title || "";

    document.getElementById("year").value =
      film.year || "";

    document.getElementById("director").value =
      film.director || "";

    document.getElementById("genre").value =
      film.genre || "";

    document.getElementById("format").value =
      film.format || "";

    document.getElementById("vf").value =
      film.vf || "";

    document.getElementById("coverFile").value =
      "";

    updateFormMode();

    document
      .getElementById("ownerPanel")
      .scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

  }


  function updateFormMode() {

    const title =
      document.getElementById("formTitle");

    const saveButton =
      document.getElementById("saveButton");

    const cancelButton =
      document.getElementById("cancelEditButton");

    if (!title || !saveButton || !cancelButton) {
      return;
    }

    if (editingFilmId) {

      title.innerHTML =
        "✏️ <span class='edit-title'>Modifier le film</span>";

      saveButton.innerHTML =
        "💾 Enregistrer les modifications";

      cancelButton.classList.remove("hidden");

    }
    else {

      title.innerHTML =
        currentTab === "collection"
          ? "➕ Ajouter un film"
          : "❤️ Ajouter à la wishlist";

      saveButton.innerHTML =
        currentTab === "collection"
          ? "➕ Ajouter le film"
          : "❤️ Ajouter à la wishlist";

      cancelButton.classList.add("hidden");

    }

  }


  function cancelEdit() {

    editingFilmId = null;

    clearForm();
    updateFormMode();

    const message =
      document.getElementById("formMessage");

    if (message) {

      message.className = "message";
      message.textContent = "";

    }

  }


  /* =========================================================
     JAQUETTE
     ========================================================= */

  async function uploadCover(file) {

    if (!file) {
      return null;
    }

    if (!file.type.startsWith("image/")) {

      throw new Error(
        "Le fichier sélectionné n'est pas une image."
      );

    }

    if (file.size > 10 * 1024 * 1024) {

      throw new Error(
        "L'image est trop volumineuse. Maximum : 10 Mo."
      );

    }

    const extension =
      file.name.includes(".")
        ? file.name
            .split(".")
            .pop()
            .toLowerCase()
        : "jpg";

    const fileName =
      currentUser.id +
      "/" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 10) +
      "." +
      extension;

    const {
      error: uploadError
    } = await supabaseClient
      .storage
      .from("covers")
      .upload(
        fileName,
        file,
        {
          cacheControl: "3600",
          upsert: false
        }
      );

    if (uploadError) {
      throw uploadError;
    }

    const {
      data
    } = supabaseClient
      .storage
      .from("covers")
      .getPublicUrl(fileName);

    if (!data || !data.publicUrl) {

      throw new Error(
        "Impossible de récupérer l'adresse de la jaquette."
      );

    }

    return data.publicUrl;

  }


  /* =========================================================
     SUPPRESSION
     ========================================================= */

  async function deleteFilm(id) {

    if (!currentUser) {
      return;
    }

    const source =
      currentTab === "collection"
        ? films
        : wishlist;

    const film =
      source.find(
        function(item) {
          return String(item.id) === String(id);
        }
      );

    if (!film) {
      return;
    }

    const confirmation =
      confirm(
        'Voulez-vous vraiment supprimer "' +
        film.title +
        '" ?'
      );

    if (!confirmation) {
      return;
    }

    const table =
      currentTab === "collection"
        ? "Films"
        : "Wishlist";

    const {
      error
    } = await supabaseClient
      .from(table)
      .delete()
      .eq("id", id);

    if (error) {

      alert(
        "Erreur lors de la suppression : " +
        error.message
      );

      return;

    }

    if (currentTab === "collection") {

      await loadFilms();

    }
    else {

      await loadWishlist();

    }

    displayFilms();

  }


  /* =========================================================
     FORMULAIRE
     ========================================================= */

  function clearForm() {

    const ids = [
      "title",
      "year",
      "director",
      "genre",
      "format",
      "vf",
      "coverFile"
    ];

    ids.forEach(
      function(id) {

        const element =
          document.getElementById(id);

        if (element) {
          element.value = "";
        }

      }
    );

  }


  /* =========================================================
     FILTRES
     ========================================================= */

  function resetFilters() {

    const search =
      document.getElementById("search");

    const format =
      document.getElementById("formatFilter");

    const vf =
      document.getElementById("vfFilter");

    if (search) {
      search.value = "";
    }

    if (format) {
      format.value = "";
    }

    if (vf) {
      vf.value = "";
    }

    displayFilms();

  }


  /* =========================================================
     EXPORT
     ========================================================= */

  function exportFilms() {

    const data =
      JSON.stringify(
        {
          collection: films,
          wishlist: wishlist
        },
        null,
        2
      );

    const blob =
      new Blob(
        [data],
        {
          type: "application/json"
        }
      );

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      "ma-collection-et-ma-wishlist.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

  }


  /* =========================================================
     IMPORT
     ========================================================= */

  async function importFilms(event) {

    if (!currentUser) {

      alert(
        "Vous devez être connecté pour importer des films."
      );

      return;

    }

    const file =
      event.target.files[0];

    if (!file) {
      return;
    }

    try {

      const text =
        await file.text();

      const imported =
        JSON.parse(text);

      let collectionToImport = [];
      let wishlistToImport = [];

      if (Array.isArray(imported)) {

        collectionToImport =
          imported;

      }
      else {

        collectionToImport =
          Array.isArray(imported.collection)
            ? imported.collection
            : [];

        wishlistToImport =
          Array.isArray(imported.wishlist)
            ? imported.wishlist
            : [];

      }

      const clean =
        function(list) {

          return list.map(
            function(film) {

              return {

                title:
                  film.title || "",

                year:
                  film.year || null,

                director:
                  film.director || null,

                genre:
                  film.genre || null,

                format:
                  film.format || null,

                vf:
                  film.vf || null,

                cover:
                  film.cover || null

              };

            }
          );

        };

      collectionToImport =
        clean(collectionToImport);

      wishlistToImport =
        clean(wishlistToImport);

      const total =
        collectionToImport.length +
        wishlistToImport.length;

      if (!confirm(
        "Importer " +
        total +
        " film(s) ?"
      )) {

        event.target.value = "";

        return;

      }

      if (collectionToImport.length > 0) {

        const {
          error
        } = await supabaseClient
          .from("Films")
          .insert(collectionToImport);

        if (error) {
          throw error;
        }

      }

      if (wishlistToImport.length > 0) {

        const {
          error
        } = await supabaseClient
          .from("Wishlist")
          .insert(wishlistToImport);

        if (error) {
          throw error;
        }

      }

      alert(
        "✅ Import terminé !"
      );

      await loadAll();

    }
    catch (error) {

      console.error(error);

      alert(
        "❌ Erreur lors de l'import : " +
        error.message
      );

    }

    event.target.value = "";

  }


  /* =========================================================
     SECURITE
     ========================================================= */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================================
     MESSAGES
     ========================================================= */

  function showMessage(
    element,
    text,
    type
  ) {

    if (!element) {

      console.error(
        "Élément de message introuvable :",
        text
      );

      return;

    }

    element.textContent = text;

    element.className =
      "message " + type;

  }

</script>
